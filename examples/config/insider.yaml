# Replace paths before running. All paths are interpreted from the command working directory.
DATA:
  GENOME: /absolute/path/assembly.fasta # Assembly used as the read-mapping target (FASTA)
  TE_DB: /absolute/path/original_TE_database.fasta # TE sequence database (multi-FASTA)
  WORK_DIRECTORY: /absolute/path/new_insider_output # New directory for all analysis outputs
  REFERENCE: /absolute/path/reference.fasta # Reference assembly for INSIDER comparison (FASTA)

CHOICE:
  PIPELINE:
    INSIDER_VARIANT: true # Compare the sample assembly with DATA.REFERENCE
    OUTSIDER_VARIANT: false # Read-based variant detection disabled
    TE_GENOME: false # Optional catalogue of resident TEs in the assembly
    UNMAPPED_TE: false # No reads in this assembly-only example; true requires DATA.SAMPLE
    REPORT: true # Generate the interactive HTML report and offline help

TOOLS:
  QUARTO: /opt/quarto/bin/quarto # Report renderer inside the current container
  LIFTOFF: /opt/conda/envs/liftoff_env/bin/liftoff # Flank projection tool; used with combined integration

PARAMS:
  THREADS: 8 # Threads requested per job; total allocation is limited by --cores
