
# all path can be relatif or absolute
DATA: 
    REFERENCE:       "/path/to/reference_file.fasta"   #reference genome (fasta file) only if INSIDER_VARIANT = True [optional]
    GENOME:          "/path/to/genome_file.fasta"      #genome (fasta file) [required]
    SAMPLE:          "/path/to/reads_file.fastq"       #long reads (a fastq[.gz] file) only if OUTSIDER_VARIANT = True [optional]
    WORK_DIRECTORY:  "TrEMOLO_OUTPUT"                  #name of output directory [required or empty]
    TE_DB:           "/path/to/database_TE.fasta"      #Database of TE (a fasta file) [required]


CHOICE:
    PIPELINE:
        UNMAPPED_TE: False      # optional TE catalogue in reads without genomic alignment
        OUTSIDER_VARIANT: True  # TE no assembled (out of genome)
        INSIDER_VARIANT: True   # TE assembled (in genome)
        TE_GENOME: False        # annotate resident TE copies across complete assemblies
        REPORT: True            # for getting report.html with graph
    OUTSIDER_VARIANT:
        CALL_SV: "sniffles1" # sniffles1 (1.0.12b), sniffles2 (2.8.1); sniffles = legacy alias
        INTEGRATE_TE_TO_GENOME: True # (True, False) Re-build the assembly with outsiders integrated in
        INTEGRATION_ALLOW_PARTIAL: False # fail if an eligible insertion cannot be integrated
        CLIPPED_READS: False # (True, False) Processing of clipped reads (SOFT, HARD)
    INTERMEDIATE_FILE: True     # to keep the intermediate analysis files to process them. 


PARAMS:
    UNMAPPED_TE:
        MIN_PIDENT: 80
        MIN_ALIGNED_BP: 80
        MAX_EVALUE: 1e-10
        FULL_LENGTH_COVERAGE: 80
    # Genomic distances in bp; see docs/window-parameters.md
    WINDOWS:
        OUTSIDER_INSERTION_CLUSTER_DISTANCE: 50
        OUTSIDER_SOFT_CLIP_WINDOW: 50
        OUTSIDER_HARD_CLIP_CLUSTER_DISTANCE: 100
        OUTSIDER_EVIDENCE_CLUSTER_DISTANCE: 100
        OUTSIDER_EVIDENCE_MATCH_WINDOW: 100
        OUTSIDER_SNIFFLES_READ_MATCH_WINDOW: 30
        OUTSIDER_SNIFFLES_READ_FETCH_WINDOW: 1
        OUTSIDER_SNIFFLES_READ_FLANK_SIZE: 30
        OUTSIDER_CLIPPED_SEQUENCE_PADDING: 100
        OUTSIDER_FREQUENCY_WINDOW: 50
        OUTSIDER_FREQUENCY_REGION_MERGE_DISTANCE: 1
        INSIDER_FREQUENCY_OUTER_MARGIN: 100
        INSIDER_FREQUENCY_INNER_MARGIN: 5
        INSIDER_FREQUENCY_DEPTH_MARGIN: 30
        INSIDER_FREQUENCY_SIZE_WINDOW: 30
        INSIDER_FREQUENCY_BREAKPOINT_DISTANCE: 30
        TE_INFOS_DELETION_EXCLUSION_WINDOW: 30
    THREADS: 8 #number of threads for some task
    TE_GENOME:
        TARGETS: ["GENOME"]     # optionally add REFERENCE when DATA.REFERENCE is available
        CHROM_KEEP: "."          # Python regex on chromosome name only; exact dm6: '^([23][RL]|[X4Y])$'
        MIN_PIDENT: 65           # permissive resident-TE discovery threshold
        MIN_ALIGNED_BP: 80       # minimum significant aligned fragment length
        MAX_EVALUE: 1e-10
        MIN_CHAIN_GAP: 200       # minimum gap tolerance for collinear fragments
        MAX_GAP_FRACTION: 0.2    # additional tolerance relative to consensus length
        MAX_OVERLAP: 100         # tolerated overlap between chained fragments
        FULL_LENGTH_COVERAGE: 80 # classification threshold, never a discovery filter
        HIGH_CONFIDENCE_PIDENT: 80
        PARTIAL_COVERAGE: 20
        AMBIGUITY_OVERLAP: 0.8   # reciprocal overlap for alternative family matches
    OUTSIDER_VARIANT:
        SNIFFLES:
            MIN_SUPPORT: 1     # minimum supporting reads; both generations keep their own other defaults
        MINIMAP2:
            PRESET_OPTION: 'map-ont' # minimap2 preset option is map-ont by default (map-pb, map-ont etc)
            OPTION: '' # more option of minimap2
        SAMTOOLS_VIEW:
            PRESET_OPTION: '' 
        SAMTOOLS_SORT:
            PRESET_OPTION: ''
        SAMTOOLS_CALLMD:
            PRESET_OPTION: ''
        TSD:
            SIZE_FLANK: 20  # flanking sequence size to calculate TSD put value >= 4 
        LIFT_OFF:
            FLANK_SIZE: 100000 # source flank on each side of an integrated TE
            MAX_GAP: 20000     # maximum projected interval/overlap on the reference
        TE_DETECTION:
            CHROM_KEEP: "." # Python regex on chromosome name only; exact dm6: '^([23][RL]|[X4Y])$'; '.' keeps all
            GET_SEQ_REPORT_OPTION: "-m 30" #option get_seq_vcf.py option du fichier de récupération des séquences dans le vcf
            TIME_LIMIT: 0 # time limit for processing SV detection (rule TrEMOLO_SV_TE); put value >= 0 (hours); 0 means no time limit
            CHUNK_SIZE: 10000000 # reference bases per CIGAR extraction job; 0 uses whole chromosomes
            SOFT_CLIP_DIAGNOSTICS: False # optional second BLAST of all soft clips; not used for final calls
        PARS_BLN_OPTION: "--min-size-percent 80 --min-pident 80 -k 'INS|DEL'" # option of TrEMOLO/pipeline/lib/python/parse_blast_main.py  Warning d'ont put -c option
    INSIDER_VARIANT:
        PARS_BLN_OPTION: "--min-size-percent 80 --min-pident 80"
        MINIMAP2:
            PRESET_OPTION: 'asm5' # minimap2 preset option is asm5 by default (asm5, asm10, asm20 etc)
            OPTION: '--cs'

# Executable overrides (optional). Sniffles 1 remains the default binary.
TOOLS:
    SNIFFLES1: sniffles
    SNIFFLES2: sniffles2
