DATA:
  REFERENCE: TrEMOLO/test/tmp_ref.fasta
  GENOME: TrEMOLO/test/tmp_genome.fasta
  SAMPLE: TrEMOLO/test/tmp_sample.fastq
  WORK_DIRECTORY: work_refactor_test
  TE_DB: TrEMOLO/test/canonical_TE.fa

CHOICE:
  PIPELINE:
    OUTSIDER_VARIANT: true
    INSIDER_VARIANT: true
    TE_GENOME: true
    REPORT: true
  OUTSIDER_VARIANT:
    CALL_SV: sniffles1
    INTEGRATE_TE_TO_GENOME: true
    CLIPPED_READS: true
TOOLS:
  LIFTOFF: /opt/conda/envs/liftoff_env/bin/liftoff
  QUARTO: /opt/quarto/bin/quarto

REPORT:
  TITLE: TrEMOLO test report
  AUTHOR: TrEMOLO regression suite
  LOCUS_WINDOW: 100

PARAMS:
  # Genomic distances in bp; see docs/window-parameters.md
  WINDOWS:
    OUTSIDER_INSERTION_CLUSTER_DISTANCE: 50
    OUTSIDER_SOFT_CLIP_WINDOW: 50
    OUTSIDER_HARD_CLIP_CLUSTER_DISTANCE: 100
    OUTSIDER_EVIDENCE_CLUSTER_DISTANCE: 100
    OUTSIDER_EVIDENCE_MATCH_WINDOW: 100
    OUTSIDER_SNIFFLES_READ_MATCH_WINDOW: 30
    OUTSIDER_SNIFFLES_READ_FETCH_WINDOW: 1
    OUTSIDER_SNIFFLES_READ_FLANK_SIZE: 30
    OUTSIDER_CLIPPED_SEQUENCE_PADDING: 100
    OUTSIDER_FREQUENCY_WINDOW: 50
    OUTSIDER_FREQUENCY_REGION_MERGE_DISTANCE: 1
    INSIDER_FREQUENCY_OUTER_MARGIN: 100
    INSIDER_FREQUENCY_INNER_MARGIN: 5
    INSIDER_FREQUENCY_DEPTH_MARGIN: 30
    INSIDER_FREQUENCY_SIZE_WINDOW: 30
    INSIDER_FREQUENCY_BREAKPOINT_DISTANCE: 30
    TE_INFOS_DELETION_EXCLUSION_WINDOW: 30
  THREADS: 8
  TE_GENOME:
    TARGETS: [GENOME]
    CHROM_KEEP: "."
    MIN_PIDENT: 65
    MIN_ALIGNED_BP: 80
    MAX_EVALUE: 1e-10
    MIN_CHAIN_GAP: 200
    MAX_GAP_FRACTION: 0.2
    MAX_OVERLAP: 100
    FULL_LENGTH_COVERAGE: 80
    HIGH_CONFIDENCE_PIDENT: 80
    PARTIAL_COVERAGE: 20
    AMBIGUITY_OVERLAP: 0.8
  OUTSIDER_VARIANT:
    MINIMAP2:
      PRESET_OPTION: map-ont
      OPTION: ''
    SAMTOOLS_VIEW:
      PRESET_OPTION: ''
    SAMTOOLS_SORT:
      PRESET_OPTION: ''
    SAMTOOLS_CALLMD:
      PRESET_OPTION: ''
    TSD:
      SIZE_FLANK: 10
    LIFT_OFF:
      FLANK_SIZE: 100000
      MAX_GAP: 20000
    TE_DETECTION:
      CHROM_KEEP: "^[23][RL]_,^[X4Y]_"
      GET_SEQ_REPORT_OPTION: "-m 1000"
      TIME_LIMIT: 0
    PARS_BLN_OPTION: "--min-size-percent 90 --min-pident 90 -k 'INS|DEL'"
